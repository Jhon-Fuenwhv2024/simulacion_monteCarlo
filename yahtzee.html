<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 YAHTZEE - Juega contra la IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .die {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 3px solid #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .die:hover {
            transform: scale(1.1);
        }

        .die.locked {
            border: 4px solid gold;
            box-shadow: 0 0 10px gold;
        }

        .die-lock {
            position: absolute;
            top: 5px;
            right: 5px;
            color: gold;
            font-size: 16px;
        }

        .scoreboard {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .scoreboard th {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: bold;
        }

        .scoreboard td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        .scoreboard tr:nth-child(even) {
            background: #f9f9f9;
        }

        .scoreboard .total-row {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-roll {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-score {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .category-btn {
            padding: 10px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: #667eea;
            color: white;
        }

        .category-btn.available {
            background: #e8f0fe;
        }

        .category-btn.used {
            background: #f0f0f0;
            color: #ccc;
            cursor: not-allowed;
            border-color: #ccc;
        }

        .info-box {
            background: white;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .info-box strong {
            color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .turn-indicator {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .game-over-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px;
            width: calc(100% - 40px);
            max-height: 85vh;
            overflow: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .final-scores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .final-score {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .final-score h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .final-score .score {
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .stats-table th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: left;
        }

        .stats-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .stats-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .final-stats-wrap {
            margin-top: 10px;
            text-align: left;
        }

        .final-stats-wrap summary {
            cursor: pointer;
            font-weight: 700;
            color: #667eea;
            outline: none;
        }

        .final-stats-scroll {
            margin-top: 10px;
            max-height: 280px;
            overflow: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            background: white;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            .categories {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 YAHTZEE 🎲</h1>
            <p>Juega contra la IA inteligente</p>
        </div>

        <div class="content">
            <!-- Sección izquierda: Tu juego -->
            <div>
                <div class="turn-indicator">
                    <div id="turn">Turno: 1/13</div>
                    <div id="rolls-left">Tiradas disponibles: 3</div>
                </div>

                <div class="section">
                    <h2>🎯 Tus Dados</h2>
                    <div class="dice-container" id="dice-container"></div>
                    <div class="buttons">
                        <button class="btn-roll" onclick="rollDice()" id="roll-btn">🎲 Lanzar</button>
                        <button class="btn-score" onclick="showCategories()" id="score-btn">✏️ Anotar</button>
                    </div>
                    <p style="font-size: 12px; color: #666; text-align: center;">Click en los dados para bloquearlos</p>
                </div>

                <div class="section" style="display: none;" id="categories-section">
                    <h2>📋 Elige Categoría</h2>
                    <div class="categories" id="categories-grid"></div>
                    <button class="btn-reset" onclick="hideCategoryPanel()" style="width: 100%; margin-top: 10px;">Cerrar</button>
                </div>
            </div>

            <!-- Sección derecha: Puntuación -->
            <div>
                <div class="section">
                    <h2>📊 Tablero de Puntuación</h2>
                    <table class="scoreboard" id="scoreboard"></table>
                </div>

                <div class="section">
                    <h2>📈 Estadísticas</h2>
                    <div class="stats-grid" id="stats"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de fin de juego -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="game-result">🏆 ¡Ganaste! 🏆</h2>
            <div class="final-scores">
                <div class="final-score">
                    <h3>👤 Tú</h3>
                    <div class="score" id="player-final-score">0</div>
                </div>
                <div class="final-score">
                    <h3>🤖 IA</h3>
                    <div class="score" id="ia-final-score">0</div>
                </div>
            </div>
            <div class="final-stats-wrap">
                <details open>
                    <summary>📊 Estadísticas finales (desplegar/ocultar)</summary>
                    <div class="final-stats-scroll">
                        <table class="stats-table" id="final-stats"></table>
                    </div>
                </details>
            </div>
            <div class="modal-actions">
                <button class="btn-reset" onclick="startNewGame()">🔄 Nueva partida</button>
                <button class="btn-score" onclick="closeGameOver()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            "ones", "twos", "threes", "fours", "fives", "sixes",
            "threeOfKind", "fourOfKind", "fullHouse", "smallStraight",
            "largeStraight", "yahtzee", "chance"
        ];

        const CATEGORY_NAMES = {
            "ones": "Unos", "twos": "Doses", "threes": "Treses", "fours": "Cuatros",
            "fives": "Cincos", "sixes": "Seises", "threeOfKind": "Trío",
            "fourOfKind": "Póker", "fullHouse": "Casa Llena",
            "smallStraight": "Escalera Pequeña", "largeStraight": "Escalera Grande",
            "yahtzee": "Yahtzee", "chance": "Oportunidad"
        };

        let gameState = {
            playerDice: [0, 0, 0, 0, 0],
            locked: [false, false, false, false, false],
            rollsLeft: 3,
            turn: 1,
            playerScores: {},
            iaScores: {},
            playerTotal: 0,
            iaTotal: 0,
            isPlayerTurn: true,
            stats: {
                playerRolls: 0,
                iaRolls: 0,
                playerCategories: {},
                iaCategories: {}
            }
        };

        // Inicializar
        CATEGORIES.forEach(cat => {
            gameState.playerScores[cat] = null;
            gameState.iaScores[cat] = null;
            gameState.stats.playerCategories[cat] = 0;
            gameState.stats.iaCategories[cat] = 0;
        });

        function resetGameState() {
            gameState = {
                playerDice: [0, 0, 0, 0, 0],
                locked: [false, false, false, false, false],
                rollsLeft: 3,
                turn: 1,
                playerScores: {},
                iaScores: {},
                playerTotal: 0,
                iaTotal: 0,
                isPlayerTurn: true,
                stats: {
                    playerRolls: 0,
                    iaRolls: 0,
                    playerCategories: {},
                    iaCategories: {}
                }
            };
            CATEGORIES.forEach(cat => {
                gameState.playerScores[cat] = null;
                gameState.iaScores[cat] = null;
                gameState.stats.playerCategories[cat] = 0;
                gameState.stats.iaCategories[cat] = 0;
            });
        }

        function closeGameOver() {
            document.getElementById('gameOverModal').classList.remove('show');
        }

        function startNewGame() {
            closeGameOver();
            resetGameState();
            document.getElementById('categories-section').style.display = 'none';
            document.getElementById('roll-btn').disabled = false;
            document.getElementById('score-btn').disabled = false;
            updateUI();
        }

        function rollDice() {
            if (!gameState.isPlayerTurn || gameState.rollsLeft <= 0) return;

            for (let i = 0; i < 5; i++) {
                if (!gameState.locked[i]) {
                    gameState.playerDice[i] = Math.floor(Math.random() * 6) + 1;
                }
            }

            gameState.rollsLeft--;
            gameState.stats.playerRolls++;
            updateUI();

            if (gameState.rollsLeft === 0) {
                document.getElementById('roll-btn').disabled = true;
            }
        }

        function toggleLock(index) {
            gameState.locked[index] = !gameState.locked[index];
            updateUI();
        }

        function scoreHand(category, dice) {
            const counts = {};
            dice.forEach(d => counts[d] = (counts[d] || 0) + 1);
            const freqs = Object.values(counts).sort((a, b) => b - a);
            const total = dice.reduce((a, b) => a + b, 0);

            if (["ones", "twos", "threes", "fours", "fives", "sixes"].includes(category)) {
                const num = parseInt(category[0]) || 6;
                return (counts[num] || 0) * num;
            }
            if (category === "threeOfKind") return freqs[0] >= 3 ? total : 0;
            if (category === "fourOfKind") return freqs[0] >= 4 ? total : 0;
            if (category === "fullHouse") return (freqs[0] === 3 && freqs[1] === 2) ? 25 : 0;
            if (category === "smallStraight") return hasSequence(dice, 4) ? 30 : 0;
            if (category === "largeStraight") return hasSequence(dice, 5) ? 40 : 0;
            if (category === "yahtzee") return freqs[0] === 5 ? 50 : 0;
            if (category === "chance") return total;
            return 0;
        }

        function hasSequence(dice, length) {
            const uniq = [...new Set(dice)].sort((a, b) => a - b);
            for (let i = 0; i <= uniq.length - length; i++) {
                let isSeq = true;
                for (let j = 1; j < length; j++) {
                    if (uniq[i + j] !== uniq[i + j - 1] + 1) isSeq = false;
                }
                if (isSeq) return true;
            }
            return false;
        }

        function showCategories() {
            document.getElementById('categories-section').style.display = 'block';
            updateCategoriesGrid();
        }

        function hideCategoryPanel() {
            document.getElementById('categories-section').style.display = 'none';
        }

        function scoreCategory(category) {
            if (gameState.playerScores[category] !== null) return;

            const score = scoreHand(category, gameState.playerDice);
            gameState.playerScores[category] = score;
            gameState.playerTotal += score;
            gameState.stats.playerCategories[category] = 1;

            document.getElementById('roll-btn').disabled = false;
            gameState.rollsLeft = 3;
            gameState.locked = [false, false, false, false, false];

            hideCategoryPanel();
            updateUI();

            // IA juega después de 1 segundo
            setTimeout(() => {
                iaPlayTurn();
            }, 1500);
        }

        function iaPlayTurn() {
            // IA tira
            for (let i = 0; i < 5; i++) {
                gameState.playerDice[i] = Math.floor(Math.random() * 6) + 1;
            }
            gameState.locked = [false, false, false, false, false];
            gameState.stats.iaRolls++;

            // IA retira 1-2 veces (simplificado - aleatorio)
            const rerolls = Math.floor(Math.random() * 2) + 1;
            for (let r = 0; r < rerolls; r++) {
                const unlocked = [];
                for (let i = 0; i < 5; i++) {
                    if (!gameState.locked[i]) unlocked.push(i);
                }
                // IA decide aleatoriamente qué bloquear (simplificado)
                const toKeep = Math.floor(Math.random() * 5);
                for (let i = 0; i < 5; i++) {
                    gameState.locked[i] = Math.random() < 0.4;
                }
                
                for (let i = 0; i < 5; i++) {
                    if (!gameState.locked[i]) {
                        gameState.playerDice[i] = Math.floor(Math.random() * 6) + 1;
                    }
                }
                gameState.stats.iaRolls++;
            }

            // IA elige mejor categoría disponible
            let bestCat = null, bestScore = -1;
            CATEGORIES.forEach(cat => {
                if (gameState.iaScores[cat] === null) {
                    const score = scoreHand(cat, gameState.playerDice);
                    if (score > bestScore) {
                        bestScore = score;
                        bestCat = cat;
                    }
                }
            });

            if (bestCat) {
                gameState.iaScores[bestCat] = bestScore;
                gameState.iaTotal += bestScore;
                gameState.stats.iaCategories[bestCat] = 1;
            }

            // Siguiente turno
            gameState.turn++;
            gameState.playerDice = [0, 0, 0, 0, 0];
            gameState.locked = [false, false, false, false, false];

            updateUI();

            if (gameState.turn > 13) {
                endGame();
            }
        }

        function updateCategoriesGrid() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';
            
            CATEGORIES.forEach(cat => {
                const score = scoreHand(cat, gameState.playerDice);
                const isUsed = gameState.playerScores[cat] !== null;
                const btn = document.createElement('button');
                btn.className = `category-btn ${isUsed ? 'used' : 'available'}`;
                btn.textContent = `${CATEGORY_NAMES[cat]}\n${score}`;
                btn.onclick = () => scoreCategory(cat);
                btn.disabled = isUsed;
                grid.appendChild(btn);
            });
        }

        function updateUI() {
            // Dados
            const diceContainer = document.getElementById('dice-container');
            diceContainer.innerHTML = '';
            gameState.playerDice.forEach((die, i) => {
                const dieEl = document.createElement('div');
                dieEl.className = `die ${gameState.locked[i] ? 'locked' : ''}`;
                dieEl.textContent = die;
                if (gameState.locked[i]) {
                    dieEl.innerHTML += '<div class="die-lock">🔒</div>';
                }
                dieEl.onclick = () => toggleLock(i);
                diceContainer.appendChild(dieEl);
            });

            // Info
            document.getElementById('turn').textContent = `Turno: ${gameState.turn}/13`;
            document.getElementById('rolls-left').textContent = `Tiradas disponibles: ${gameState.rollsLeft}`;

            // Tablero
            updateScoreboard();

            // Estadísticas
            updateStats();
        }

        function updateScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '<thead><tr><th>Categoría</th><th>👤 Tú</th><th>🤖 IA</th></tr></thead><tbody>';
            
            CATEGORIES.forEach(cat => {
                const row = sb.insertRow();
                const p = gameState.playerScores[cat];
                const ia = gameState.iaScores[cat];
                row.innerHTML = `
                    <td>${CATEGORY_NAMES[cat]}</td>
                    <td><strong>${p !== null ? p : '-'}</strong></td>
                    <td><strong>${ia !== null ? ia : '-'}</strong></td>
                `;
            });

            const totalRow = sb.insertRow();
            totalRow.className = 'total-row';
            totalRow.innerHTML = `
                <td><strong>TOTAL</strong></td>
                <td><strong>${gameState.playerTotal}</strong></td>
                <td><strong>${gameState.iaTotal}</strong></td>
            `;
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <div class="stat-item">
                    <div class="stat-label">Tu total de lanzamientos</div>
                    <div class="stat-value">${gameState.stats.playerRolls}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Lanzamientos IA</div>
                    <div class="stat-value">${gameState.stats.iaRolls}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Categorías usadas (Tú)</div>
                    <div class="stat-value">${Object.values(gameState.stats.playerCategories).reduce((a, b) => a + b, 0)}/13</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Categorías usadas (IA)</div>
                    <div class="stat-value">${Object.values(gameState.stats.iaCategories).reduce((a, b) => a + b, 0)}/13</div>
                </div>
            `;
        }

        function endGame() {
            const modal = document.getElementById('gameOverModal');
            const resultEl = document.getElementById('game-result');
            const playerFinal = document.getElementById('player-final-score');
            const iaFinal = document.getElementById('ia-final-score');

            playerFinal.textContent = gameState.playerTotal;
            iaFinal.textContent = gameState.iaTotal;

            if (gameState.playerTotal > gameState.iaTotal) {
                resultEl.textContent = '🏆 ¡¡GANASTE!! 🏆';
            } else if (gameState.iaTotal > gameState.playerTotal) {
                resultEl.textContent = '😢 Perdiste 😢';
            } else {
                resultEl.textContent = '🤝 ¡EMPATE! 🤝';
            }

            // Tabla de estadísticas finales
            const finalStats = document.getElementById('final-stats');
            finalStats.innerHTML = '<tr><th>Categoría</th><th style="text-align:center;">Tú</th><th style="text-align:center;">IA</th></tr>';
            CATEGORIES.forEach(cat => {
                const pScore = gameState.playerScores[cat];
                const iaScore = gameState.iaScores[cat];
                const pDisplay = pScore !== null ? pScore : 0;
                const iaDisplay = iaScore !== null ? iaScore : 0;
                const row = finalStats.insertRow();
                row.innerHTML = `
                    <td>${CATEGORY_NAMES[cat]}</td>
                    <td style="text-align: center;"><strong>${pDisplay}</strong></td>
                    <td style="text-align: center;"><strong>${iaDisplay}</strong></td>
                `;
            });

            // Desactivar botones
            document.getElementById('roll-btn').disabled = true;
            document.getElementById('score-btn').disabled = true;

            modal.classList.add('show');
        }

        // Iniciar
        updateUI();
    </script>
</body>
</html>
